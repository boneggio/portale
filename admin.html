<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Console Boneggio</title>
<link rel="icon" href="/loghi/oliamo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra in alto, poi una riga per sezione (ordine = ordine sul portale); barra di salvataggio fissa in basso. */
:root{
  --bg:#eef1ea; --surface:#ffffff; --ink:#1f2a1c; --muted:#5e6a58; --line:#d9ded2; --accent:#3f6b2a;
  --ok:#2e7d32; --warn:#b26a00; --off:#b3261e; --hid:#6b7280;
  --display:"Fraunces", Georgia, serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121610;--surface:#1b2018;--ink:#eef1e8;--muted:#a3ab99;--line:#2d3428;--accent:#8cc46a;--ok:#6fcf73;--warn:#f0b04a;--off:#ff7a70;--hid:#9aa3ae;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121610;--surface:#1b2018;--ink:#eef1e8;--muted:#a3ab99;--line:#2d3428;--accent:#8cc46a;--ok:#6fcf73;--warn:#f0b04a;--off:#ff7a70;--hid:#9aa3ae;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 120px}
h1{font-family:var(--display);font-weight:800;font-size:30px;margin:0}
button,input,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.seg button:focus-visible,.arrow:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}

/* Accesso */
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;color:var(--muted)}
input,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:500}
textarea{resize:vertical;min-height:58px}
.err{color:var(--off);font-weight:600;min-height:1.2em;margin:0}

/* Console */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.top .actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{color:var(--muted);margin:6px 0 22px;max-width:65ch}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--state);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 56px 1fr;gap:12px 14px;align-items:center}
.row[data-stato="attivo"]{--state:var(--ok)}
.row[data-stato="spento"]{--state:var(--off)}
.row[data-stato="arrivo"]{--state:var(--warn)}
.row[data-stato="nascosto"]{--state:var(--hid)}
.row[data-stato="nascosto"] .ident{opacity:.55}
.order{display:flex;flex-direction:column;align-items:center;gap:2px}
.pos{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.arrow{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;line-height:1}
.arrow[disabled]{opacity:.3;cursor:default}
.ident img{width:56px;height:56px;object-fit:contain;display:block}
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.name{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.name h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.name a{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"][data-v="attivo"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="spento"]{background:var(--off);color:#fff}
.seg button[aria-pressed="true"][data-v="arrivo"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="nascosto"]{background:var(--hid);color:#fff}
details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
details[open]{display:flex;flex-direction:column;gap:10px}
.fields{display:grid;gap:10px;margin-top:8px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.status{font-weight:600;color:var(--muted)}
.status.dirty{color:var(--warn)}
.status.saved{color:var(--ok)}
[hidden]{display:none!important}
@media (max-width:520px){
  .row{grid-template-columns:auto 1fr}
  .ident{display:none}
  .seg{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<form class="login" id="login" hidden>
  <h1>Console Boneggio</h1>
  <label for="pw">Password<input id="pw" type="password" autocomplete="current-password" required></label>
  <label for="otp">Codice a 6 cifre (se attivo)<input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" placeholder="123456"></label>
  <p class="err" id="loginErr"></p>
  <button class="btn primary" type="submit">Entra</button>
</form>

<div class="wrap" id="app" hidden>
  <div class="top">
    <h1>Console Boneggio</h1>
    <div class="actions">
      <a class="btn" href="/" target="_blank" rel="noopener">Vedi il portale</a>
      <button class="btn" type="button" id="copy">Copia link da inviare</button>
      <button class="btn" type="button" id="logout">Esci</button>
    </div>
  </div>
  <p class="hint">L'ordine qui è l'ordine sul portale: usa le frecce per spostare. <b>Attivo</b> si può prenotare, <b>Sold out</b> appare opaco, <b>In arrivo</b> fa pulsare il logo, <b>Nascosto</b> non si vede.</p>
  <div class="list" id="list"></div>
</div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <span class="status" id="status">Tutto salvato</span>
    <button class="btn primary" type="button" id="save" disabled>Salva modifiche</button>
  </div>
</div>

<script>
const STATI = [["attivo","Attivo"],["spento","Sold out"],["arrivo","In arrivo"],["nascosto","Nascosto"]];
let token = null, sezioni = [], dirty = false;
try { token = localStorage.getItem("boneggio_sessione"); } catch(e) {}

const $ = id => document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function api(path, opts = {}){
  const r = await fetch("/api/" + path, {
    method: opts.method || "GET",
    headers: Object.assign({"Content-Type":"application/json"}, token ? {"X-Sessione": token} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "login") { mostraLogin("Accesso scaduto: entra di nuovo."); throw new Error("401"); }
  if (!r.ok) throw new Error(d.errore || ("Errore " + r.status));
  return d;
}

function mostraLogin(msg){
  token = null; try{localStorage.removeItem("boneggio_sessione")}catch(e){}
  $("app").hidden = true; $("bar").hidden = true; $("login").hidden = false;
  $("loginErr").textContent = msg || "";
  $("pw").focus();
}

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try{
    const d = await api("login", {method:"POST", body:{password:$("pw").value, codice:$("otp").value}});
    token = d.token; try{localStorage.setItem("boneggio_sessione", token)}catch(e){}
    $("pw").value = ""; $("otp").value = "";
    avvia();
  }catch(err){ $("loginErr").textContent = err.message; }
});

$("logout").addEventListener("click", async () => {
  try{ await api("logout", {method:"POST"}); }catch(e){}
  mostraLogin();
});

$("copy").addEventListener("click", async () => {
  const url = location.origin + "/";
  try{ await navigator.clipboard.writeText(url); $("copy").textContent = "Copiato ✓"; }
  catch(e){ $("copy").textContent = url; }
  setTimeout(() => $("copy").textContent = "Copia link da inviare", 2500);
});

function setDirty(v){
  dirty = v;
  $("save").disabled = !v;
  $("status").textContent = v ? "Modifiche non salvate" : "Tutto salvato";
  $("status").className = "status " + (v ? "dirty" : "");
}

function render(){
  $("list").innerHTML = sezioni.map((s, i) => `
    <article class="row" data-stato="${s.stato}" data-i="${i}">
      <div class="order">
        <button class="arrow" type="button" data-move="-1" aria-label="Sposta su" ${i===0?"disabled":""}>▲</button>
        <span class="pos">${i+1}</span>
        <button class="arrow" type="button" data-move="1" aria-label="Sposta giù" ${i===sezioni.length-1?"disabled":""}>▼</button>
      </div>
      <div class="ident"><img src="${esc(s.logo)}" alt=""></div>
      <div class="main">
        <div class="name"><h2>${esc(s.nome)}</h2><a href="${esc(s.console)}" target="_blank" rel="noopener">Apri la sua console ↗</a></div>
        <div class="seg" role="group" aria-label="Stato di ${esc(s.nome)}">
          ${STATI.map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${s.stato===v}">${l}</button>`).join("")}
        </div>
        <details>
          <summary>Modifica testo e link</summary>
          <div class="fields">
            <label for="n${i}">Nome<input id="n${i}" data-f="nome" value="${esc(s.nome)}"></label>
            <label for="d${i}">Descrizione per i clienti<textarea id="d${i}" data-f="descrizione">${esc(s.descrizione)}</textarea></label>
            <label for="l${i}">Link a cui porta la scheda (per i siti riservati incolla quello con ?c=…)<input id="l${i}" data-f="link" value="${esc(s.link)}" inputmode="url"></label>
          </div>
        </details>
      </div>
    </article>`).join("");
}

$("list").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const i = +row.dataset.i;
  const mv = e.target.closest("[data-move]");
  if (mv && !mv.disabled){
    const j = i + (+mv.dataset.move);
    [sezioni[i], sezioni[j]] = [sezioni[j], sezioni[i]];
    render(); setDirty(true);
    const btn = document.querySelector(`.row[data-i="${j}"] [data-move="${mv.dataset.move}"]`);
    (btn && !btn.disabled ? btn : document.querySelector(`.row[data-i="${j}"] .arrow:not([disabled])`))?.focus();
    return;
  }
  const st = e.target.closest(".seg button");
  if (st){
    sezioni[i].stato = st.dataset.v;
    row.dataset.stato = st.dataset.v;
    row.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b === st));
    setDirty(true);
  }
});
$("list").addEventListener("input", e => {
  const f = e.target.dataset.f; if (!f) return;
  const i = +e.target.closest(".row").dataset.i;
  sezioni[i][f] = e.target.value;
  if (f === "nome") e.target.closest(".row").querySelector("h2").textContent = e.target.value;
  setDirty(true);
});

$("save").addEventListener("click", async () => {
  $("save").disabled = true; $("status").textContent = "Salvataggio…";
  try{
    const d = await api("admin", {method:"POST", body:{sezioni}});
    sezioni = d.sezioni; render(); setDirty(false);
    $("status").textContent = "Salvato ✓ Il portale è già aggiornato"; $("status").className = "status saved";
  }catch(err){
    if (err.message !== "401"){ $("status").textContent = err.message; $("status").className = "status dirty"; $("save").disabled = false; }
  }
});

window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });

async function avvia(){
  if (!token) return mostraLogin();
  try{
    const d = await api("admin");
    sezioni = d.sezioni;
    $("login").hidden = true; $("app").hidden = false; $("bar").hidden = false;
    render(); setDirty(false);
  }catch(e){ if (e.message !== "401") mostraLogin(e.message); }
}
avvia();
</script>
</body>
</html>
