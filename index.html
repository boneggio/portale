<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boneggio</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#eef1ea">
<meta name="description" content="Castagne, uova, olio, miele e casa vacanze: scegli cosa prenotare.">
<link rel="icon" href="/img/icona.svg" type="image/svg+xml">
<link rel="alternate icon" href="/img/icona.png" type="image/png">
<link rel="apple-touch-icon" href="/img/icona.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: titolo sobrio in alto, poi una scheda grande per ogni sezione, in griglia; su telefono una colonna. */
:root{
  --bg:#eef1ea;
  --surface:#ffffff;
  --ink:#1f2a1c;
  --muted:#5e6a58;
  --line:#d9ded2;
  --accent:#3f6b2a;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121610;--surface:#1b2018;--ink:#eef1e8;--muted:#a3ab99;--line:#2d3428;--accent:#8cc46a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121610;--surface:#1b2018;--ink:#eef1e8;--muted:#a3ab99;--line:#2d3428;--accent:#8cc46a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:48px 20px 56px}
header{margin-bottom:28px}
.logo-testa{margin:0;line-height:0}
.logo-testa img{display:block;width:min(100%,460px);height:auto}
:root[data-theme="dark"] .logo-testa img{background:#fbf8f2;border-radius:16px;padding:12px 16px;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-testa img{background:#fbf8f2;border-radius:16px;padding:12px 16px;box-sizing:border-box}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,60px);line-height:1;margin:0 0 10px;letter-spacing:-.01em}
.sub{margin:0;font-size:18px;color:var(--muted);text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{--c:var(--accent);position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s ease, box-shadow .15s ease}
a.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -14px rgba(0,0,0,.35)}
a.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.logo{width:96px;height:96px;display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin:0}
.desc{margin:0;color:var(--muted);font-size:16px}
.cta{margin-top:auto;display:inline-flex;align-items:center;justify-content:space-between;gap:26px;align-self:flex-start;font-weight:700;font-size:16px;letter-spacing:.01em;padding:8px 8px 8px 20px;border-radius:999px;color:#fff;
  background:linear-gradient(135deg, color-mix(in srgb,var(--c) 88%,#fff) 0%, var(--c) 45%, color-mix(in srgb,var(--c) 78%,#000) 100%);
  box-shadow:0 10px 22px -10px color-mix(in srgb,var(--c) 85%,transparent), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .15s ease, box-shadow .15s ease}
.cta .freccia{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--c);font-size:18px;line-height:1;transition:transform .2s ease}
.cta{position:relative;overflow:hidden;isolation:isolate}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;z-index:-1;pointer-events:none;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent);transform:skewX(-18deg);animation:lampo 2.6s ease-in-out infinite}
.cta .freccia{animation:spinta 3s ease-in-out infinite}
.grid > a.card:nth-child(2n) .cta::after,.grid > a.card:nth-child(2n) .cta .freccia{animation-delay:.9s}
.grid > a.card:nth-child(3n) .cta::after,.grid > a.card:nth-child(3n) .cta .freccia{animation-delay:1.7s}
@keyframes lampo{0%,45%{left:-60%}80%,100%{left:130%}}
@keyframes spinta{0%,55%,100%{transform:translateX(0)}66%{transform:translateX(12px)}76%{transform:translateX(-2px)}86%{transform:translateX(8px)}94%{transform:translateX(0)}}
a.card:hover .cta{box-shadow:0 14px 26px -10px color-mix(in srgb,var(--c) 90%,transparent), inset 0 1px 0 rgba(255,255,255,.25)}
a.card:hover .cta .freccia{animation:none;transform:translateX(4px)}
a.card:active .cta{transform:scale(.97)}
.badge{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:12px;padding:8px 20px 8px 8px;border-radius:999px;min-width:220px}

/* SOLD OUT: scheda spenta, grigia, a righe; pulsante grigio non cliccabile */
.card.spento{cursor:not-allowed;background:repeating-linear-gradient(135deg, var(--surface) 0 14px, color-mix(in srgb,var(--line) 55%,var(--surface)) 14px 28px)}
.card.spento::before{background:var(--line)}
.card.spento .logo,.card.spento h2,.card.spento .desc{filter:grayscale(1);opacity:.45}
.card.spento .badge{background:#5f6368;color:#fff;justify-content:flex-start;box-shadow:none}
.card.spento .badge .ico{background:rgba(255,255,255,.18);color:#fff}

/* IN ARRIVO: alone che pulsa attorno al logo, pulsante con riflesso che scorre e clessidra */
.card.arrivo{cursor:default;border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.card.arrivo .logo{position:relative}
.card.arrivo .logo::after{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent);animation:alone 2.2s ease-out infinite}
.card.arrivo .badge{color:#fff;justify-content:flex-start;
  background:linear-gradient(110deg, var(--c) 0%, var(--c) 38%, color-mix(in srgb,var(--c) 55%,#fff) 50%, var(--c) 62%, var(--c) 100%);
  background-size:250% 100%;animation:riflesso 2.6s linear infinite;
  box-shadow:0 10px 22px -12px color-mix(in srgb,var(--c) 85%,transparent)}
.card.arrivo .badge .ico{background:#fff;color:var(--c)}
.card.arrivo .badge .ico span{display:inline-block;animation:clessidra 2.6s ease-in-out infinite}

/* parti comuni dei due stati */
.badge .ico{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1}
.badge .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-transform:none;letter-spacing:0}
.badge .txt b{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.badge .txt small{font-size:13px;font-weight:500;opacity:.9}

@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes alone{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}80%,100%{box-shadow:0 0 0 18px transparent}}
@keyframes riflesso{0%{background-position:100% 0}100%{background-position:-150% 0}}
@keyframes clessidra{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.card.arrivo .logo,.card.arrivo .logo::after,.card.arrivo .badge,.card.arrivo .badge .ico span{animation:none}a.card,.cta,.cta .freccia{transition:none}.cta::after,.cta .freccia{animation:none}}

.msg{padding:24px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
/* TELEFONO: schede compatte, logo a sinistra, pulsante largo quanto la scheda */
@media (max-width:560px){
  .wrap{padding:28px 16px 36px}
  header{margin-bottom:22px}
  h1{font-size:40px;margin-bottom:6px}
  .sub{font-size:17px}
  .grid{gap:14px}
  .card{display:grid;grid-template-columns:72px 1fr;grid-template-areas:"logo nome" "logo desc" "az az";column-gap:16px;row-gap:4px;padding:18px 16px 16px}
  .logo{grid-area:logo;width:72px;height:72px;align-self:start}
  h2{grid-area:nome;font-size:24px;align-self:end}
  .desc{grid-area:desc;font-size:16px;line-height:1.4}
  .cta,.badge{grid-area:az;justify-self:stretch;align-self:auto;margin-top:16px;font-size:17px}
  .cta{padding:9px 9px 9px 22px}
  .cta .freccia{width:40px;height:40px;font-size:20px}
  .badge{padding:9px 22px 9px 9px}
  .badge .ico{width:40px;height:40px;font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo-testa"><img src="/img/logo-boneggio.svg" alt="Boneggio" width="870" height="168"></h1>
  </header>
  <main class="grid" id="grid" aria-live="polite">
    <div class="msg">Caricamento…</div>
  </main>
  <footer>© Boneggio</footer>
</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function scheda(s){
  const inner = `
    <div class="logo"><img src="${esc(s.logo)}" alt=""></div>
    <h2>${esc(s.nome)}</h2>
    <p class="desc">${esc(s.descrizione)}</p>`;
  const stile = `style="--c:${esc(s.colore)}"`;
  if (s.stato === "spento") {
    return `<div class="card spento" ${stile}>${inner}<span class="badge"><span class="ico" aria-hidden="true">✕</span><span class="txt"><b>Sold out</b><small>Non disponibile</small></span></span></div>`;
  }
  if (s.stato === "arrivo") {
    return `<div class="card arrivo" ${stile}>${inner}<span class="badge"><span class="ico" aria-hidden="true"><span>⏳</span></span><span class="txt"><b>In arrivo</b><small>Presto disponibile</small></span></span></div>`;
  }
  return `<a class="card" ${stile} href="${esc(s.link)}" rel="noopener">${inner}<span class="cta">${esc(s.pulsante || "Prenota")}<span class="freccia" aria-hidden="true">→</span></span></a>`;
}

async function carica(){
  const grid = document.getElementById("grid");
  try{
    const qs = new URLSearchParams(location.search);
    const c = qs.get("c");
    const r = await fetch("/api/portale" + (c ? "?c=" + encodeURIComponent(c) : ""), {cache:"no-store", credentials:"same-origin"});
    const d = await r.json();
    if (c) { try { history.replaceState(null, "", location.pathname); } catch(e) {} }
    if (d.riservato) {
      grid.innerHTML = '<div class="msg"><b>Pagina riservata.</b><br>Per entrare usa il link che ti abbiamo mandato.</div>';
      return;
    }
    if (!r.ok) throw new Error(d.errore || r.status);
    grid.innerHTML = d.sezioni.length ? d.sezioni.map(scheda).join("") : '<div class="msg">Al momento non ci sono prenotazioni aperte. Torna a trovarci presto.</div>';
  }catch(e){
    grid.innerHTML = '<div class="msg">La pagina non si è caricata. Ricarica tra qualche secondo.</div>';
  }
}
carica();
</script>
</body>
</html>
